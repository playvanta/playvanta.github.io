function fallback(name){
 const safe=name.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550">
 <defs><linearGradient id="g"><stop stop-color="#7422b8"/>
 <stop offset="1" stop-color="#093e86"/></linearGradient></defs>
 <rect width="900" height="550" fill="url(#g)"/>
 <circle cx="720" cy="130" r="180" fill="#f06aff" opacity=".22"/>
 <path d="M0 470L190 220L360 460L560 180L900 460V550H0Z" fill="#090c2c" opacity=".65"/>
 <text x="450" y="300" fill="white" font-size="48" font-family="Arial" font-weight="bold" text-anchor="middle">${safe}</text>
 </svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

function imageFor(key,name){
 const img=document.createElement("img");
 img.alt=name+" game artwork";
 img.loading="lazy";
 img.decoding="async";

 const urls=artwork[key]||[];
 let i=0;
 img.onerror=()=>{
  i++;
  if(i<urls.length)img.src=urls[i];
  else{
   img.onerror=null;
   img.src=fallback(name);
  }
 };
 img.src=urls[0]||fallback(name);
 return img;
}

const $=id=>document.getElementById(id);

[...new Set(games.map(g=>g.category))].sort().forEach(g=>{
 const option=document.createElement("option");
 option.value=g;
 option.textContent=g;
 $("genre").append(option);
});

function makeCard(g){
 const card=document.createElement("article");
 card.className="pv-game";

 const photo=document.createElement("div");
 photo.className="pv-game-photo";
 photo.append(imageFor(g.image,g.name));

 const body=document.createElement("div");
 body.className="pv-game-body";

 const title=document.createElement("h2");
 title.textContent=g.name;

 const genre=document.createElement("span");
 genre.className="pv-genre";
 genre.textContent=g.genre;

 const price=document.createElement("span");
 price.className="pv-price";
 price.textContent=g.price;

 const official=document.createElement("a");
 official.className="pv-official";
 official.href=g.url;
 official.target="_blank";
 official.rel="noopener noreferrer";
 official.textContent="Official Website ↗";

 body.append(title,genre,price,official);

 if(g.tool){
  const tool=document.createElement("a");
  tool.className="pv-tool-link";
  tool.href=g.tool;
  tool.textContent="PlayVanta Tool →";
  body.append(tool);
 }

 card.append(photo,body);
 return card;
}

function render(){
 const q=$("search").value.toLowerCase().trim();
 const genre=$("genre").value;
 const platform=$("platform").value;
 const price=$("price").value;

 const filtered=games.filter(g=>
  (g.name+" "+g.genre+" "+g.category).toLowerCase().includes(q)
  &&(!genre||g.category===genre)
  &&(!platform||g.platforms.includes(platform))
  &&(!price||g.price===price)
 );

 $("gameGrid").replaceChildren(...filtered.map(makeCard));
 $("empty").hidden=filtered.length!==0;
}

["search","genre","platform","price"].forEach(id=>{
 $(id).addEventListener("input",render);
});

$("year").textContent=new Date().getFullYear();
render();
