function fallback(name){
 const safe=name.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><defs><linearGradient id="g"><stop stop-color="#7523b5"/><stop offset="1" stop-color="#123f8e"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><circle cx="620" cy="120" r="160" fill="#e86bff" opacity=".25"/><path d="M0 410L190 180L340 420L520 160L800 410V500H0Z" fill="#0a1030" opacity=".65"/><text x="400" y="280" text-anchor="middle" fill="white" font-family="Arial" font-size="47" font-weight="bold">${safe}</text></svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function imageFor(key,name){
 const img=document.createElement("img");
 img.alt=name+" game artwork";
 img.loading="lazy";img.decoding="async";
 const urls=artwork[key]||[];
 let i=0;
 img.onerror=()=>{
  i++;
  if(i<urls.length)img.src=urls[i];
  else{img.onerror=null;img.src=fallback(name)}
 };
 img.src=urls[0]||fallback(name);
 return img;
}
const $=id=>document.getElementById(id);

[...new Set(games.map(g=>g.category))].sort().forEach(g=>{
 const option=document.createElement("option");
 option.value=g;option.textContent=g;
 $("genre").append(option);
});

function makeCard(g){
 const card=document.createElement("article");
 card.className="card";
 const photo=document.createElement("div");
 photo.className="photo";
 photo.append(imageFor(g.image,g.name));

 const info=document.createElement("div");
 info.className="card-info";

 const title=document.createElement("h2");
 title.textContent=g.name;

 const genre=document.createElement("span");
 genre.className="genre";
 genre.textContent=g.genre;

 const price=document.createElement("span");
 price.className="price";
 price.textContent=g.price;

 const official=document.createElement("a");
 official.className="official";
 official.href=g.url;
 official.target="_blank";
 official.rel="noopener noreferrer";
 official.textContent="Official Website ↗";

 info.append(title,genre,price,official);
 card.append(photo,info);
 return card;
}

function render(){
 const q=$("search").value.toLowerCase().trim();
 const genre=$("genre").value;
 const platform=$("platform").value;
 const price=$("price").value;

 const filtered=games.filter(g=>
  (g.name+" "+g.genre+" "+g.category).toLowerCase().includes(q)
  &&(!genre||g.category===genre)
  &&(!platform||g.platforms.includes(platform))
  &&(!price||g.price===price)
 );

 $("gameGrid").replaceChildren(...filtered.map(makeCard));
 $("empty").hidden=filtered.length!==0;
}

["search","genre","platform","price"].forEach(id=>{
 $(id).addEventListener("input",render);
});
$("year").textContent=new Date().getFullYear();
